analyzer:
  # `flutter create .` (run in CI to scaffold the uncommitted web/
  # platform folder -- see .github/workflows/) regenerates a generic
  # test/widget_test.dart referencing a class called MyApp, which
  # doesn't exist in this project (the root widget is CafeTwinApp).
  # That stale template is never part of this repo and carries no
  # real coverage, so it's excluded outright rather than chased every
  # time tooling recreates it.
  exclude:
    - test/widget_test.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_unused_constructor_parameters
    - prefer_final_fields
    - prefer_final_locals
    - unnecessary_new
    - unawaited_futures

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_unused_constructor_parameters
    - prefer_final_fields
    - prefer_final_locals
    - unnecessary_new
    - unawaited_futures

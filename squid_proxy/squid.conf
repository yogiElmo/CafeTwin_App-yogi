# ============================================================================
# CaféTwin — Squid Proxy Configuration for a Gaming/Internet Café
# ============================================================================
# Purpose : Per-station bandwidth management. When the CaféTwin dashboard
#           raises a NET-BW alert ("bandwidth utilization > 80%"), staff can
#           enforce the throttles defined here so one station cannot hog the
#           café's internet link during peak hours.
#
# Install : Ubuntu/Debian  ->  sudo apt install squid
#           This file goes to ->  /etc/squid/squid.conf
#           Apply changes     ->  sudo systemctl restart squid
#
# Network : Café LAN is 192.168.10.0/24
#           ST-01 .. ST-10 are 192.168.10.11 .. 192.168.10.20 (static DHCP)
# ============================================================================

# ---------------------------------------------------------------------------
# 1. Basics
# ---------------------------------------------------------------------------
http_port 3128
visible_hostname cafetwin-proxy

# Where cached objects and logs live
cache_dir ufs /var/spool/squid 2000 16 256     # 2 GB disk cache
access_log /var/log/squid/access.log squid
cache_log  /var/log/squid/cache.log

# ---------------------------------------------------------------------------
# 2. Access control — only café devices may use the proxy
# ---------------------------------------------------------------------------
acl cafe_lan src 192.168.10.0/24
acl localhost src 127.0.0.1/32

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 7777  # example game-launcher port (adjust per café)
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
http_access allow cafe_lan
http_access deny all

# ---------------------------------------------------------------------------
# 3. Station ACLs — one per gaming station (matches CaféTwin ST-01..ST-10)
# ---------------------------------------------------------------------------
acl st_01 src 192.168.10.11/32
acl st_02 src 192.168.10.12/32
acl st_03 src 192.168.10.13/32
acl st_04 src 192.168.10.14/32
acl st_05 src 192.168.10.15/32
acl st_06 src 192.168.10.16/32
acl st_07 src 192.168.10.17/32
acl st_08 src 192.168.10.18/32
acl st_09 src 192.168.10.19/32
acl st_10 src 192.168.10.20/32

# ---------------------------------------------------------------------------
# 4. Bandwidth management (delay pools)
#    Scenario from the CaféTwin rules engine:
#      NET-BW fires when a station uses > 80% of link capacity.
#    Delay pools cap each station so this cannot starve the others.
#
#    Assumed café link: 100 Mbps down.
#      - Each station: guaranteed burst, then capped at 15 Mbps
#      - Whole café pool: capped at 90 Mbps (10% headroom for VoIP/POS)
#
#    Squid delay pool units are BYTES per second.
#      15 Mbps  = 1,875,000 B/s
#      90 Mbps  = 11,250,000 B/s
# ---------------------------------------------------------------------------
delay_pools 2

# Pool 1 (class 2): aggregate limit for the whole café
delay_class 1 2
delay_parameters 1 11250000/11250000 1875000/4000000
#                  ^ aggregate restore/max  ^ per-host restore/burst-max

# Pool 2 (class 1): strict per-station cap used when a NET-BW alert is active
# (enable per station as needed — see Section 5)
delay_class 2 1
delay_parameters 2 1250000/1250000      # 10 Mbps hard cap for flagged stations

# All normal traffic goes through pool 1
delay_access 1 allow cafe_lan
delay_access 1 deny all

# ---------------------------------------------------------------------------
# 5. "Alert response" rules — map CaféTwin alerts to enforcement
#
#    Each station has a toggle block below, delimited by CAFETWIN markers.
#    cafetwin_backend_devops/squid_controller.js flips a station's block
#    between commented (normal pool 1) and active (strict pool 2, 10 Mbps
#    cap) automatically when a NET-BW/NET-LAT alert fires or clears, via
#    squid_proxy/toggle_throttle.sh over SSH. You can also edit these lines
#    by hand and run `sudo squid -k reconfigure` — both paths work the same
#    way, the script just automates what a human would type.
# ---------------------------------------------------------------------------
# CAFETWIN:THROTTLE:ST-01:START
# delay_access 2 allow st_01
# CAFETWIN:THROTTLE:ST-01:END
# CAFETWIN:THROTTLE:ST-02:START
# delay_access 2 allow st_02
# CAFETWIN:THROTTLE:ST-02:END
# CAFETWIN:THROTTLE:ST-03:START
# delay_access 2 allow st_03
# CAFETWIN:THROTTLE:ST-03:END
# CAFETWIN:THROTTLE:ST-04:START
# delay_access 2 allow st_04
# CAFETWIN:THROTTLE:ST-04:END
# CAFETWIN:THROTTLE:ST-05:START
# delay_access 2 allow st_05
# CAFETWIN:THROTTLE:ST-05:END
# CAFETWIN:THROTTLE:ST-06:START
# delay_access 2 allow st_06
# CAFETWIN:THROTTLE:ST-06:END
# CAFETWIN:THROTTLE:ST-07:START
# delay_access 2 allow st_07
# CAFETWIN:THROTTLE:ST-07:END
# CAFETWIN:THROTTLE:ST-08:START
# delay_access 2 allow st_08
# CAFETWIN:THROTTLE:ST-08:END
# CAFETWIN:THROTTLE:ST-09:START
# delay_access 2 allow st_09
# CAFETWIN:THROTTLE:ST-09:END
# CAFETWIN:THROTTLE:ST-10:START
# delay_access 2 allow st_10
# CAFETWIN:THROTTLE:ST-10:END

# Catch-all: any station not actively flagged above falls through to pool 1
# (via the "delay_access 1 allow cafe_lan" rule already set in Section 4).
delay_access 2 deny all

# ---------------------------------------------------------------------------
# 6. Sensible defaults
# ---------------------------------------------------------------------------
coredump_dir /var/spool/squid
refresh_pattern ^ftp:           1440  20% 10080
refresh_pattern ^gopher:        1440   0% 1440
refresh_pattern -i (/cgi-bin/|\?) 0    0% 0
refresh_pattern .               0     20% 4320

# Do not cache game launchers' update manifests (they change often)
acl game_updates dstdomain .steampowered.com .epicgames.com .riotgames.com
cache deny game_updates

# /etc/fail2ban/jail.d/cafetwin.conf

[cafetwin-api]
enabled  = true
port     = 3000
filter   = cafetwin-api
logpath  = /var/log/cafetwin/access.log
maxretry = 10
findtime = 300
bantime  = 3600
action   = iptables-multiport[name=cafetwin, port="3000", protocol=tcp]

[cafetwin-ssh]
enabled  = true
port     = ssh
filter   = sshd
logpath  = /var/log/auth.log
maxretry = 3
findtime = 600
bantime  = 7200

# Filter definition: /etc/fail2ban/filter.d/cafetwin-api.conf

name: cafetwin_app
description: "CafeTwin - a gaming cafe digital twin dashboard with a built-in Dart simulation engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  # Renders the otpauth:// URI POST /auth/totp/setup returns as a QR code
  # on-device, entirely client-side -- the backend never generates an
  # image, just the URI (see the "TOTP MULTI-FACTOR AUTHENTICATION"
  # section of cafetwin_backend_devops/server.js).
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

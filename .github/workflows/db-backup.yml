# Scheduled off-site backup of the CaféTwin production database.
#
# Render's free/starter Postgres tiers don't include the automatic backup
# retention the paid plans do, and even where a provider does back a
# database up, that copy lives on the provider's own infrastructure -- an
# outage or account issue there could take the only copy with it. This
# workflow gives the project an independent, scheduled, off-site copy
# using GitHub Actions' own artifact storage.
#
# Requires ONE repository secret: DATABASE_URL -- the external connection
# string for the Render Postgres instance to back up (Render dashboard ->
# your Postgres instance -> "Connections" -> "External Database URL").
# See cafetwin_backend_devops/BACKUP_RESTORE.md for full setup and restore
# steps, including what to do if Render's network access rules block
# GitHub Actions' outbound IPs.
#
# PG_MAJOR_VERSION below must be >= the Render Postgres instance's own
# major version -- pg_dump refuses to run against a NEWER server than
# itself (an older client dumping a newer server can silently miss new
# features). If Render is ever upgraded to a newer Postgres major version,
# bump this number to match (Render dashboard -> your Postgres instance ->
# Info shows its version) -- see BACKUP_RESTORE.md's troubleshooting note.

name: Database backup

env:
  PG_MAJOR_VERSION: "18"

on:
  schedule:
    # 03:00 UTC daily -- outside typical café operating hours in any
    # timezone this project has been run from.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafetwin_backend_devops
    steps:
      - uses: actions/checkout@v4

      # Installs a specific PostgreSQL client major version rather than
      # whatever "postgresql-client" happens to resolve to on the runner's
      # default Ubuntu repos (that defaulted to v16, too old to dump a v18
      # server -- pg_dump: "aborting because of server version mismatch").
      # Explicitly ensuring the PGDG apt repo first (rather than assuming
      # the runner image already has it configured) keeps this working
      # even if that assumption stops holding on a future runner image.
      - name: Install PostgreSQL client (v${{ env.PG_MAJOR_VERSION }})
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_MAJOR_VERSION}"
          echo "/usr/lib/postgresql/${PG_MAJOR_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set -- see BACKUP_RESTORE.md." >&2
            exit 1
          fi
          chmod +x scripts/backup.sh
          BACKUP_DIR="$PWD/backups" ./scripts/backup.sh

      - name: Upload dump as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: cafetwin-db-backup-${{ github.run_id }}
          path: cafetwin_backend_devops/backups/*.dump
          retention-days: 30
          if-no-files-found: error

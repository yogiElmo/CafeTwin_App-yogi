# Builds the Flutter web app and publishes it to GitHub Pages on every
# push to main, so you get a live URL instead of running `flutter run`
# each time you want to see a change.
#
# One-time setup after your first push:
#   1. Repo Settings -> Pages -> Source: "GitHub Actions".
#   2. (Optional, to connect a live backend) Settings -> Secrets and
#      variables -> Actions -> New repository variable:
#        API_BASE_URL = https://your-backend.onrender.com
#      Leave it unset to ship the app in pure offline-simulation mode.
#
# Your site will be published at:
#   https://<your-github-username>.github.io/<this-repo-name>/

name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "cafetwin_backend_devops/**"
      - "cafetwin_backend_security/**"
      - "squid_proxy/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    # Gates the build below on a green test suite -- see flutter-tests.yml
    # for the same checks run on pull requests / feature branches too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform folder if missing
        run: |
          test -d web || flutter create . --platforms=web
          # `flutter create .` also drops in a generic test/widget_test.dart
          # (referencing a class called MyApp) whenever one doesn't already
          # exist -- this project's root widget is CafeTwinApp, so that
          # stale boilerplate fails `flutter analyze`/`flutter test`. Our
          # real suite (test/rules_engine_test.dart, insights_engine_test.dart,
          # login_screen_test.dart) covers this app; drop the placeholder so
          # it can't shadow them.
          rm -f test/widget_test.dart

      - run: flutter pub get
      # --no-fatal-infos: fail on real errors/warnings, not on info-level
      # deprecation notices (e.g. dart:html -> package:web, still functional
      # -- see lib/services/platform/downloader_web.dart -- and
      # DropdownButtonFormField's value/initialValue, left as `value` in
      # lib/screens/setup_screen.dart because switching it would silently
      # break the dropdown's reactivity to setState changes).
      - run: flutter analyze --no-fatal-infos
      # Explicit file list (not a bare `flutter test`) so a stray
      # regenerated test/widget_test.dart -- see the analyzer exclude
      # in analysis_options.yaml -- can never be picked up and run.
      - run: flutter test test/rules_engine_test.dart test/insights_engine_test.dart test/login_screen_test.dart

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # This repo ships lib/ + pubspec.yaml only (see README) - the web/
      # platform folder is generated on demand rather than committed.
      - name: Generate web platform folder if missing
        run: |
          test -d web || flutter create . --platforms=web
          # `flutter create .` also drops in a generic test/widget_test.dart
          # (referencing a class called MyApp) whenever one doesn't already
          # exist -- this project's root widget is CafeTwinApp, so that
          # stale boilerplate fails `flutter analyze`/`flutter test`. Our
          # real suite (test/rules_engine_test.dart, insights_engine_test.dart,
          # login_screen_test.dart) covers this app; drop the placeholder so
          # it can't shadow them.
          rm -f test/widget_test.dart

      - run: flutter pub get

      # --base-href must match the repo name so assets resolve correctly
      # under https://<user>.github.io/<repo>/
      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

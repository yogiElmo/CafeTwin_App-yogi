# Runs `flutter analyze` + `flutter test` on every push/PR that touches
# the Flutter app, so a broken widget or a failing unit test is caught
# before merge -- rather than the first time anyone notices being the
# next demo. deploy-web.yml also runs this same suite as a gate right
# before it builds/publishes the site (see its `test` job); this file
# additionally covers pull requests and feature branches, where nothing
# is being deployed.

name: Flutter tests

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-tests.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # This repo ships lib/ + pubspec.yaml only (see README) - the web/
      # platform folder is generated on demand rather than committed.
      - name: Generate web platform folder if missing
        run: |
          test -d web || flutter create . --platforms=web
          # `flutter create .` also drops in a generic test/widget_test.dart
          # (referencing a class called MyApp) whenever one doesn't already
          # exist -- this project's root widget is CafeTwinApp, so that
          # stale boilerplate fails `flutter analyze`/`flutter test`. Our
          # real suite (test/rules_engine_test.dart, insights_engine_test.dart,
          # login_screen_test.dart) covers this app; drop the placeholder so
          # it can't shadow them.
          rm -f test/widget_test.dart

      - run: flutter pub get
      # --no-fatal-infos: fail on real errors/warnings, not on info-level
      # deprecation notices (e.g. dart:html -> package:web, still functional
      # -- see lib/services/platform/downloader_web.dart -- and
      # DropdownButtonFormField's value/initialValue, left as `value` in
      # lib/screens/setup_screen.dart because switching it would silently
      # break the dropdown's reactivity to setState changes).
      - run: flutter analyze --no-fatal-infos
      # Explicit file list (not a bare `flutter test`) so a stray
      # regenerated test/widget_test.dart -- see the analyzer exclude
      # in analysis_options.yaml -- can never be picked up and run.
      - run: flutter test test/rules_engine_test.dart test/insights_engine_test.dart test/login_screen_test.dart
